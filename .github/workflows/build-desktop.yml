name: Build Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - ccr-5db67aa9-m80746
    paths-ignore:
      - .github/workflows/release-apk.yml

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libmpv-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package bundle
        run: |
          mv build/linux/x64/release/bundle build/linux/x64/release/aniverse
          tar -czf aniverse-linux-x64.tar.gz -C build/linux/x64/release aniverse

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: aniverse-linux-x64
          path: aniverse-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        # The Firebase C++ SDK pulled in by firebase_core declares a CMake
        # minimum below 3.5, which CMake 4 rejects unless this is set.
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: flutter build windows --release

      - name: Package app
        shell: pwsh
        run: |
          Rename-Item build/windows/x64/runner/Release AniVerse
          Compress-Archive -Path build/windows/x64/runner/AniVerse -DestinationPath aniverse-windows-x64.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: aniverse-windows-x64
          path: aniverse-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

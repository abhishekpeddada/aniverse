name: Release

# Attaches the APK and the Windows/Linux builds that earlier "Build APK" and
# "Build Desktop" runs already produced to the GitHub release TAG, without
# rebuilding them, and sets the release notes.
#
# The release (and its tag) must be created on GitHub first: the workflow
# token can't create a tag on a commit that adds workflow files. Runs when
# this file changes; re-run it after creating the release.
on:
  push:
    branches:
      - ccr-5db67aa9-m80746
    paths:
      - .github/workflows/release-apk.yml

permissions:
  contents: write
  actions: read

env:
  SOURCE_RUN_ID: '40674906108'
  DESKTOP_RUN_ID: '40674906010'
  TAG: v1.4.2

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from the build run
        uses: actions/download-artifact@v4
        with:
          name: aniverse-release-apk
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: dist

      - name: Download Windows and Linux builds
        uses: actions/download-artifact@v4
        with:
          pattern: aniverse-*-x64
          merge-multiple: true
          run-id: ${{ env.DESKTOP_RUN_ID }}
          github-token: ${{ github.token }}
          path: dist

      - name: Attach builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Release $TAG doesn't exist yet. Create it on GitHub, then re-run this workflow."
            exit 0
          fi
          cd dist
          mv app-release.apk aniverse-android.apk
          sha256sum aniverse-android.apk aniverse-windows-x64.zip aniverse-linux-x64.tar.gz > SHA256SUMS.txt
          cat > notes.md <<'NOTES'
          ## What's changed

          - **Windows and Linux apps.** Downloads are saved in `Downloads/Aniverse`, and episodes already in that folder (for example copied from your phone, with the same file names) appear in the app when it starts.
          - **New-episode notifications** for anime in Favorites, Watchlist and watch history, without duplicates. The app asks to be exempted from battery optimization so checks still run when it isn't open.
          - **Autoplay next** with an "Up next" card and countdown at the end of an episode.
          - **Skip intro / outro** buttons, for streams and downloaded episodes.
          - **Auto-rotate** in the player, and watched episodes update right away.
          - **Download all** button on the anime page; download progress shows on the episode button instead of pop-up messages.
          - **Seek bar** fixed when it showed 00:00.

          ## Downloads

          | Platform | File |
          |---|---|
          | Android | `aniverse-android.apk` (installs over v1.4.1) |
          | Windows 10/11 (64-bit) | `aniverse-windows-x64.zip`: unzip, then run `AniVerse\anime_watcher.exe` |
          | Linux (x64) | `aniverse-linux-x64.tar.gz`: extract, then run `aniverse/anime_watcher`. Needs libmpv (`sudo apt install libmpv2`). |

          ## Desktop notes

          - Google sign-in isn't available on Windows or Linux yet; history, lists and downloads are saved on the computer.
          - New-episode notifications are Android-only.
          NOTES
          gh release upload "$TAG" aniverse-android.apk aniverse-windows-x64.zip \
            aniverse-linux-x64.tar.gz SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "AniVerse $TAG" --notes-file notes.md

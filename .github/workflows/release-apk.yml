name: Release APK

# Attaches an APK that an earlier "Build APK" run already produced to the
# GitHub release TAG, without rebuilding it, and sets the release notes.
#
# The release (and its tag) must be created on GitHub first: the workflow
# token can't create a tag on a commit that adds workflow files. Runs when
# this file changes; re-run it after creating the release.
on:
  push:
    branches:
      - ccr-5db67aa9-m80746
    paths:
      - .github/workflows/release-apk.yml

permissions:
  contents: write
  actions: read

env:
  SOURCE_RUN_ID: '38053252310'
  TAG: v1.4.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from the build run
        uses: actions/download-artifact@v4
        with:
          name: aniverse-release-apk
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: apk

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Release $TAG doesn't exist yet. Create it on GitHub, then re-run this workflow."
            exit 0
          fi
          cd apk
          sha256sum app-release.apk > app-release.apk.sha256
          cat > notes.md <<'NOTES'
          ## What's changed

          - **Playback works again.** AllAnime's stream endpoint stopped working, so episodes now stream from hianime, the provider ani-cli uses. Search, lists and details still come from AllAnime.
          - **English subtitles** load reliably on every play.
          - **Downloads work again**, including HLS streams, and subtitles are saved with each download for offline viewing.
          - **Fewer failed starts:** playback retries automatically when a stream fails on first open.
          - **Google sign-in** works with the new release signing key.

          ## Notes

          - This build is signed with a new release key. If installing over an older version fails, uninstall it first. Watch history stored on the device will be lost.
          - The version shown inside the app is still 1.3.0.
          - Adult titles from the Raiden source may not load.
          NOTES
          gh release upload "$TAG" app-release.apk app-release.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "AniVerse $TAG" --notes-file notes.md

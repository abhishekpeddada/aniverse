name: Release APK

# Attaches an APK that an earlier "Build APK" run already produced to the
# GitHub release TAG, without rebuilding it, and sets the release notes.
#
# The release (and its tag) must be created on GitHub first: the workflow
# token can't create a tag on a commit that adds workflow files. Runs when
# this file changes; re-run it after creating the release.
on:
  push:
    branches:
      - ccr-5db67aa9-m80746
    paths:
      - .github/workflows/release-apk.yml

permissions:
  contents: write
  actions: read

env:
  SOURCE_RUN_ID: '38123821323'
  TAG: v1.4.1

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from the build run
        uses: actions/download-artifact@v4
        with:
          name: aniverse-release-apk
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: apk

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Release $TAG doesn't exist yet. Create it on GitHub, then re-run this workflow."
            exit 0
          fi
          cd apk
          sha256sum app-release.apk > app-release.apk.sha256
          cat > notes.md <<'NOTES'
          ## What's changed

          - **Resume works when streaming.** Choosing Resume now continues where you stopped, and the resume point is no longer reset to the start.
          - **Lock controls:** tap the lock icon in the player's top bar to disable controls and gestures. Tap the screen to show the unlock button.
          - **Faster downloads:** episode segments download in parallel.
          - **Favorites and Watchlist** load their titles and images again after a reinstall, instead of staying on "Loading...".
          - **Adult (Raiden) titles** no longer send the AllAnime referer, and the list loads faster with request timeouts.

          ## Notes

          - Signed with the same key as v1.4.0, so it installs over it directly.
          - The version shown inside the app is still 1.3.0.
          NOTES
          gh release upload "$TAG" app-release.apk app-release.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "AniVerse $TAG" --notes-file notes.md
